name: CI (Rust)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust gnullvm toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnullvm

      - name: Install WinFsp & LLVM
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi" -OutFile "winfsp.msi"
          Start-Process msiexec.exe -ArgumentList "/i winfsp.msi /qn /norestart" -Wait
          Remove-Item winfsp.msi -Force

      - name: Build Release
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (Test-Path $llvmBin) { $env:LIBCLANG_PATH = $llvmBin }
          cargo build --release
