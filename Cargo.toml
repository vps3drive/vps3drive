[package]
name = "vps3drive-rust"
version = "1.0.0"
edition = "2021"

[dependencies]
winfsp = { version = "0.12", features = ["delayload"] }
winfsp-sys = "0.12"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "blocking"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
quick-xml = "0.37"
chrono = "0.4"
tao = "0.30"
wry = "0.47"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.19"
image = { version = "0.25", default-features = false, features = ["png"] }

[patch.crates-io]
winfsp-sys = { path = "vendor/winfsp-sys" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
